name: Quality gate

on:
  workflow_call:

jobs:
  gate:
    name: Lint, test, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm ci

      - name: Lint
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
