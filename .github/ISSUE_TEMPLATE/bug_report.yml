name: Bug report
description: Report a problem with the plugin
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      render: shell
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 2.0.0
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: e.g. 1.18.0
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and local endpoint (e.g. Windows 11 with Ollama)
      placeholder: e.g. Windows 11, Ollama 0.5
